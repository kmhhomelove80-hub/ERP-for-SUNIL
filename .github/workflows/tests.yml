name: ERP tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ERP_DB_NAME: ${{ matrix.database == 'postgresql' && 'erp_test' || '' }}
      ERP_DB_USER: erp_test
      ERP_DB_PASSWORD: ephemeral-test-only
      ERP_DB_HOST: 127.0.0.1
      ERP_DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - name: Exercise old laptop upgrade and recovery
        if: matrix.database == 'sqlite'
        run: python scripts/check_laptop_upgrade.py

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test --noinput
      - run: python scripts/check_laptop_upgrade.py
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem deploy/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
