{% extends 'inventory/base.html' %}{% block content %}<h1>위치별 재고</h1>{% if user.is_staff %}<p class="desktop-only"><a id="stock-export" href="{% url 'stock-export' %}?q={{ query|urlencode }}&amp;status={{ status|urlencode }}">현재 검색 전체 엑셀 내보내기</a></p>{% endif %}<p class="notice desktop-only">개발 검증 중입니다. 운영 전 데이터 이관·대조와 백업 검증이 필요합니다.</p><form class="filters" id="stock-filter"><input aria-label="재고 검색" name="q" value="{{ query }}" placeholder="ERP 코드, 모델, 사양, 위치"><select aria-label="입고 상태" name="status"><option value="">전체 상태</option>{% for value,label in statuses %}<option value="{{ value }}" {% if status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button>검색</button></form><p id="stock-search-status" role="status" aria-live="polite"></p><section id="stock-results">{% include 'inventory/stock_results.html' %}</section>{% load static %}<script src="{% static 'inventory/live_stock.js' %}" defer></script>{% endblock %}
